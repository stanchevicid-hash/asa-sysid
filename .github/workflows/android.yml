name: android
on: [push, pull_request]
jobs:
  control-hub-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['9.2.0', '10.3.0', '11.1.0', '12.0.0']   # every FTC SDK the guides promise
    name: FTC SDK ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android 7.1 platform (Control Hub) + official FTC SDK ${{ matrix.sdk }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-25" "build-tools;34.0.0" > /dev/null
          for a in RobotCore Hardware FtcCommon; do
            curl -sfL -o $a.aar https://repo1.maven.org/maven2/org/firstinspires/ftc/$a/${{ matrix.sdk }}/$a-${{ matrix.sdk }}.aar
            unzip -p $a.aar classes.jar > $a.jar
          done
      - name: Library uses only Java APIs that exist on Android 7.1
        run: |
          mkdir out
          javac -nowarn -source 8 -target 8 -bootclasspath "$ANDROID_HOME/platforms/android-25/android.jar" \
            -cp RobotCore.jar:Hardware.jar:FtcCommon.jar -d out $(find src -name '*.java' -not -path '*/examples/*')
      - name: Converts to Android bytecode (D8, min API 24)
        run: |
          (cd out && jar cf ../asa.jar .)
          "$ANDROID_HOME/build-tools/34.0.0/d8" --release --min-api 24 --lib "$ANDROID_HOME/platforms/android-25/android.jar" \
            --classpath RobotCore.jar --classpath Hardware.jar --classpath FtcCommon.jar --output . asa.jar
          ls -la classes.dex
