<style>
/* ASA Black Box in ASA's colors: magenta on carbon black, silver text (the team logo). Magenta marks the team and
   the data (logo, tape, REC, graph lines, the center of gravity); the rest is a quiet instrument panel, so the
   traffic lights are what the eye finds. "Urgent" is orange-red so it never reads as the team pink. */
:root{color-scheme:dark;
 --bg:#09090D;--surf:#15151C;--surf2:#1F1F28;--line:#2B2B36;--fg:#F1EFF4;--dim:#A4A1AE;
 --brand:#FF2D8A;--data:#FF2D8A;--ok:#3DDC97;--warn:#FFD23F;--crit:#FF6A3D;--none:#55535F;
 --num:"Bahnschrift","DIN Alternate","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
 --txt:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:light){:root{color-scheme:light;
 --bg:#F1EFF4;--surf:#FFFFFF;--surf2:#F6F4F8;--line:#DEDAE4;--fg:#14131A;--dim:#5E5A68;
 --brand:#D8156F;--data:#D8156F;--ok:#138A55;--warn:#9A7200;--crit:#D9480F;--none:#A09CA9}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--txt);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--data);outline-offset:2px;border-radius:6px}
a{color:var(--data)}
.hide{display:none!important}.dim{color:var(--dim)}

/* header: the recorder's own colors */
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--surf);
 background-image:repeating-linear-gradient(45deg,color-mix(in srgb,var(--fg) 3%,transparent) 0 2px,transparent 2px 4px),repeating-linear-gradient(-45deg,color-mix(in srgb,var(--fg) 3%,transparent) 0 2px,transparent 2px 4px)}   /* carbon weave */
.logo{display:flex;align-items:center;gap:11px;margin-right:auto;font:600 20px/1 var(--num);letter-spacing:.01em;white-space:nowrap}
.logo img{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 35%,transparent)}
.logo em{font-style:normal;color:var(--brand)}
.tape{height:6px;background:repeating-linear-gradient(-55deg,var(--brand) 0 8px,transparent 8px 13px,color-mix(in srgb,var(--fg) 55%,transparent) 13px 15px,transparent 15px 22px),var(--surf)}
#st{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:7px;white-space:nowrap}
#st:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--crit)}#st.on:before{background:var(--ok)}
#lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
#lang button{background:none;border:0;border-radius:999px;padding:3px 9px;font:600 12px/1.4 var(--num);letter-spacing:.04em;color:var(--dim)}
#lang button.on{background:var(--surf2);color:var(--fg)}
@media(max-width:520px){header{padding:10px 14px;gap:10px}#st span{display:none}.logo{font-size:18px}}

/* tabs */
nav{display:flex;flex-wrap:wrap;gap:4px;max-width:1120px;margin:18px auto 0;padding:0 20px}
nav button{background:none;border:1px solid transparent;border-radius:999px;padding:7px 16px;color:var(--dim);display:flex;align-items:center;gap:8px;font-weight:600}
nav button:hover{color:var(--fg)}
nav button.on{background:var(--surf);border-color:var(--line);color:var(--fg)}
#t-live.rec:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);animation:rec 1.2s ease-in-out infinite}
@keyframes rec{50%{opacity:.2}}
@media(prefers-reduced-motion:reduce){#t-live.rec:before{animation:none}}

main{max-width:1120px;margin:0 auto;padding:16px 20px}
.grid{display:grid;grid-template-columns:236px minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:16px}

/* recordings: a column on a laptop, a swipeable strip on a phone */
.list{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.list div{padding:9px 12px 9px 13px;border-radius:10px;cursor:pointer;font-weight:600;border-left:3px solid transparent}
.list div:hover{background:color-mix(in srgb,var(--surf) 60%,transparent)}
.list div.on{background:var(--surf);border-left-color:var(--brand)}
.list .more{color:var(--brand);font-weight:600}
.list small{display:block;font:400 13px/1.4 var(--num);color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.03em;margin-top:1px}
@media(max-width:760px){.grid{grid-template-columns:minmax(0,1fr);gap:12px}
 .list{flex-direction:row;gap:8px;position:static;overflow-x:auto;max-height:none;padding-bottom:4px;scroll-snap-type:x proximity;scrollbar-width:none}
 .list div{flex:0 0 auto;background:var(--surf);border:1px solid var(--line);scroll-snap-align:start;padding:8px 14px}
 .list div.on{border-color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}
 nav{margin-top:12px;padding:0 14px}main{padding:12px 14px}.panel{padding:14px 16px}}

/* the verdict: the first thing anyone reads */
.hero{position:relative;padding:20px 22px 20px 30px;border-radius:16px;background:var(--surf);border:1px solid var(--line);margin-bottom:16px;overflow:hidden}
.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--lv)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--lv) 14%,transparent),transparent 55%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h1{margin:0;font:600 32px/1.12 var(--num);letter-spacing:.004em;color:var(--lv);text-wrap:balance}
.hero .meta{font:400 14px/1.4 var(--num);color:var(--dim);letter-spacing:.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.hero p{margin:10px 0 0;max-width:66ch}
.counts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.counts span{display:flex;align-items:center;gap:7px;padding:4px 11px 4px 9px;border-radius:999px;background:var(--surf2);font:600 14px/1.3 var(--num);font-variant-numeric:tabular-nums}
.counts span:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--lv)}
@media(max-width:520px){.hero{padding:16px 16px 16px 24px}.hero h1{font-size:26px}}
.lv-g{--lv:var(--ok)}.lv-y{--lv:var(--warn)}.lv-r{--lv:var(--crit)}.lv-n{--lv:var(--none)}
.hero.enter{animation:enter .35s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){.hero.enter{animation:none}}

/* findings */
.panel h2{margin:0 0 2px;font:600 15px/1.3 var(--num);letter-spacing:.02em;color:var(--dim)}
.row{display:flex;gap:13px;padding:12px 0;border-top:1px solid var(--line)}.panel h2+.row{border-top:0}
.dot{flex:0 0 12px;height:12px;border-radius:50%;margin-top:5px;background:var(--lv);box-shadow:0 0 0 4px color-mix(in srgb,var(--lv) 20%,transparent)}
.row b{display:block;font-weight:600}.row b .who{color:var(--dim);font-weight:500;margin-right:6px}
.todo{color:var(--dim);font-size:14px;margin-top:3px;max-width:70ch}
.src{display:inline-block;margin-left:8px;padding:0 8px;border-radius:999px;font:600 12px/18px var(--num);letter-spacing:.03em;vertical-align:1px;border:1px solid var(--line);color:var(--dim)}
.src.code{border-color:var(--brand);color:var(--brand)}
.counts span.src{margin:0;border:0;padding:4px 11px;font-size:14px;line-height:1.3;background:var(--surf2)}.counts span.src:before{display:none}
.counts span.src.code{color:var(--brand)}

/* graphs */
details.panel>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary:before{content:"";width:7px;height:7px;border:solid var(--dim);border-width:0 2px 2px 0;transform:rotate(-45deg);transition:transform .15s}
details.panel[open]>summary:before{transform:rotate(45deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chips label{display:flex;align-items:center;gap:6px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--dim)}
.chips label:has(input:checked){border-color:var(--data);color:var(--fg);background:color-mix(in srgb,var(--data) 12%,transparent)}
.chips input{accent-color:var(--data);margin:0}
.chips br{display:none}
canvas{width:100%;height:140px;display:block;margin-bottom:12px;border-radius:8px}
.dl{display:inline-flex;margin:2px 0 10px;font-weight:600;text-decoration:none;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surf2)}
.dl:hover{border-color:var(--data)}
pre{margin:0;white-space:pre-wrap;font:12px/1.6 ui-monospace,Consolas,monospace;color:var(--dim)}
#tip{position:fixed;display:none;pointer-events:none;background:var(--fg);color:var(--bg);box-shadow:0 4px 14px #0006;border-radius:6px;padding:3px 9px;font:600 13px/1.4 var(--num);z-index:9;font-variant-numeric:tabular-nums;white-space:nowrap}

/* live */
.livegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}@media(max-width:760px){.livegrid{grid-template-columns:minmax(0,1fr)}}
table{border-collapse:collapse;width:100%}
td{padding:7px 0;border-top:1px solid var(--line);font-size:14px;color:var(--dim)}tr:first-child td{border-top:0}
td:last-child{text-align:right;color:var(--fg);font:600 16px/1.3 var(--num);font-variant-numeric:tabular-nums}
.WARNING{color:var(--warn)}.CRITICAL{color:var(--crit)}.INFO{color:var(--dim)}
#lwarn div{padding:7px 0;border-top:1px solid var(--line)}#lwarn div:first-child{border-top:0}
#lstatus{font:600 16px/1.4 var(--num);color:var(--fg);margin-bottom:4px}#lstatus:empty{display:none}
.idle{text-align:center;padding:42px 16px}
.idle b{display:block;font:600 22px/1.2 var(--num);margin-bottom:6px}

/* a notice instead of moving the page under someone who is reading it */
#notice{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:12px;max-width:calc(100% - 28px);
 padding:10px 10px 10px 18px;border-radius:999px;background:var(--surf);border:1px solid var(--brand);box-shadow:0 10px 30px #0008;font-weight:600}
#notice.hide{display:none}
#notice .x{background:none;border:0;color:var(--dim);font-size:20px;line-height:1;padding:2px 8px}
#notice.off{border-color:var(--crit)}
@media(prefers-reduced-motion:no-preference){#notice{animation:up .25s ease-out}}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}

/* center of gravity */
.cog svg{width:100%;height:auto;max-height:500px;display:block;margin-top:8px}
.btn{background:var(--surf2);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-weight:600}
.btn:hover{border-color:var(--data)}

footer{max-width:1120px;margin:12px auto 32px;padding:18px 20px 0;color:var(--dim);font-size:14px;border-top:1px solid var(--line)}
footer .links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px}footer a{text-decoration:none;font-weight:600}
footer small{display:block;margin-top:8px;font-size:12px}

async function live(){
  try{const j=JSON.parse(await get('/api/live'));setSt(true);

    failSince=0;hideNotice('off');

    if(on&&!wasOn){hist={};hT0=now;if(tools.blackbox&&tab!=='sysid'){if(busy()&&tab!=='live')notice(t().ntLive,t().open,toLive);else{hideNotice();toLive()}}}   // never pull the viewer off SysId
    else if(wasOn&&!on){await loadFiles();if(tab!=='sysid'){if(busy()&&tab!=='live')notice(t().ntDone,t().open,toRec);else{hideNotice();toRec()}}}
    wasOn=on;$('#t-live').classList.toggle('rec',on);
    if(on)j.names.forEach((n,i)=>{const h=hist[n]||(hist[n]={t:[],v:[]});h.t.push(now-hT0);h.v.push(j.values[i]==null?NaN:+j.values[i]);
      while(h.t.length&&h.t[0]<now-hT0-60){h.t.shift();h.v.shift()}});   // last 60 s

function csv(text){const Ls=text.trim().split('\n'),h=Ls[0].split(','),cols=h.map(()=>[]);
  for(let i=1;i<Ls.length;i++){const p=Ls[i].split(',');for(let j=0;j<h.length;j++)cols[j].push(p[j]===''||p[j]==null?NaN:(isNaN(+p[j])?p[j]:+p[j]))}return{h,cols}}

const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();   // theme colors (dark / light)
// units by signal name, as FtcBlackBox records them
const unit=n=>/\.amps$/.test(n)?'A':/^battery|\.volts$|^volts$/.test(n)?'V':/_ms$/.test(n)?'ms':/\.vel$/.test(n)?'ticks/s':/\.pos$/.test(n)?'ticks':/\.temp$/.test(n)?'°C':/heading|\.deg$/.test(n)?'°':'';
const fmtV=v=>!isFinite(v)?'-':Math.abs(v)>=1000?v.toFixed(0):Math.abs(v)>=10?v.toFixed(1):v.toFixed(2);
const fmtT=s=>s>=60?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`:(s<10?s.toFixed(1):s.toFixed(0))+' s';

// One signal over time. xs = seconds (index=true: sample number). Every pixel column draws the min and the max of the
// samples that fall in it, so a one-loop spike (a stall, a brownout) stays visible however long the session is.
function plot(box,name,xs,ys,marks,index){
  const c=el('canvas');box.append(c);const dpr=devicePixelRatio||1,W=c.width=Math.max(1,(c.clientWidth||720)*dpr),H=c.height=140*dpr,g=c.getContext('2d'),u=unit(name),C=css;
  let lo=Infinity,hi=-Infinity;ys.forEach(v=>{if(isFinite(v)){lo=Math.min(lo,v);hi=Math.max(hi,v)}});const vmin=lo,vmax=hi;
  if(!isFinite(lo)){lo=0;hi=1}if(hi===lo){hi+=1;lo-=1}const pad=(hi-lo)*0.08;lo-=pad;hi+=pad;
  const top=22*dpr,bot=18*dpr,x0=xs[0],x1=xs[xs.length-1],X=x=>(x-x0)/((x1-x0)||1)*(W-2)+1,Y=y=>H-bot-(y-lo)/(hi-lo)*(H-top-bot);
  g.lineWidth=dpr;g.strokeStyle=C('--line');g.setLineDash([3*dpr,4*dpr]);
  for(let k=0;k<=3;k++){const y=Math.round(top+(H-top-bot)*k/3)+.5;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  g.setLineDash([]);if(lo<0&&hi>0){g.strokeStyle=C('--dim');g.beginPath();g.moveTo(0,Y(0));g.lineTo(W,Y(0));g.stroke()}
  (marks||[]).forEach(m=>{g.strokeStyle=C('--'+m.c);g.lineWidth=1.5*dpr;g.beginPath();g.moveTo(X(m.t),top);g.lineTo(X(m.t),H-bot);g.stroke()});
  // min/max per pixel column, split where the signal is missing
  const segs=[];let seg=null,cur=null;
  const emit=()=>{if(!cur)return;if(!seg)segs.push(seg=[]);seg.push([cur.px,cur.f],[cur.px,cur.mn],[cur.px,cur.mx],[cur.px,cur.l]);cur=null};
  for(let i=0;i<xs.length;i++){const v=ys[i];if(!isFinite(v)||!isFinite(xs[i])){emit();seg=null;continue}const px=Math.round(X(xs[i]));
    if(cur&&cur.px!==px)emit();if(!cur)cur={px,f:v,mn:v,mx:v,l:v};else{cur.mn=Math.min(cur.mn,v);cur.mx=Math.max(cur.mx,v);cur.l=v}}
  emit();
  const data=C('--data'),grad=g.createLinearGradient(0,top,0,H-bot);grad.addColorStop(0,data+'38');grad.addColorStop(1,data+'00');
  segs.forEach(sg=>{g.beginPath();sg.forEach(([x,y],i)=>i?g.lineTo(x,Y(y)):g.moveTo(x,Y(y)));
    g.strokeStyle=data;g.lineWidth=1.6*dpr;g.lineJoin='round';g.stroke();
    g.lineTo(sg[sg.length-1][0],H-bot);g.lineTo(sg[0][0],H-bot);g.closePath();g.fillStyle=grad;g.fill()});
  g.textBaseline='alphabetic';g.fillStyle=C('--fg');g.font='600 '+12*dpr+'px '+C('--num');g.fillText(name+(u?'  '+u:''),2,13*dpr);
  g.fillStyle=C('--dim');g.font=11*dpr+'px '+C('--num');g.textAlign='right';g.fillText('min '+fmtV(vmin)+'   max '+fmtV(vmax),W-2,13*dpr);
  const tl=x=>index?String(Math.round(x)):fmtT(x);
  g.textAlign='left';g.fillText(tl(x0),2,H-4*dpr);g.textAlign='center';g.fillText(tl((x0+x1)/2),W/2,H-4*dpr);g.textAlign='right';g.fillText(tl(x1),W-2,H-4*dpr);
  const tip=$('#tip');   // hover: the recorded values under the cursor (min … max when one screen pixel holds many samples)
  c.onpointermove=e=>{const r=c.getBoundingClientRect(),q=x0+((e.clientX-r.left)*dpr-1)/(W-2)*(x1-x0),dq=(x1-x0)/(W-2)*dpr*1.5;
    let a=0,b=xs.length-1;while(b-a>1){const m=(a+b)>>1;xs[m]<q-dq?a=m:b=m}
    let mn=Infinity,mx=-Infinity,best=a;for(let i=a;i<xs.length&&xs[i]<=q+dq;i++){if(Math.abs(xs[i]-q)<Math.abs(xs[best]-q))best=i;if(isFinite(ys[i])){mn=Math.min(mn,ys[i]);mx=Math.max(mx,ys[i])}}
    const val=isFinite(mn)&&mx-mn>Math.abs(mx)*0.02+1e-9?fmtV(mn)+' … '+fmtV(mx):fmtV(ys[best]);
    tip.textContent=tl(xs[best])+'   '+val+(u?' '+u:'');tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY-30+'px';tip.style.display='block'};
  c.onpointerleave=()=>tip.style.display='none';
}

// Top view (front up, right side on the right) and side view from the right (front to the right), all in cm.
function cogSvg(k){
  const stack=innerWidth<600,cmU=L==='ru'?' см':' cm';   // phone: side view under the top view, so both stay readable
  const wb=k.wheelbase,tr=k.track,h=k.height,S=Math.max(wb,tr,h),m=S*0.3,fs=S*(stack?0.075:0.06),sw=S*0.006,wr=Math.min(4.8,S*0.09),
    sideH=Math.max(h*1.4,wb*0.55),ox=m,oy=m*1.1,sx=stack?ox+(tr-wb)/2:ox+tr+m*1.5,sTop=stack?oy+wb+m*1.8:oy,
    gy=stack?sTop+sideH:oy+Math.max(wb,sideH),W=stack?ox*2+Math.max(tr,wb):sx+wb+m*0.8,HH=gy+m*0.7,
    cx=ox+tr-k.fromRight,cy=oy+wb-k.fromRear,px=sx+k.fromRear,py=gy-h,r1=v=>(Math.round(v*10)/10),
    deg=(a,b)=>Math.round(Math.atan2(a,b)*180/Math.PI),acc=css('--data'),dim=css('--dim'),fg=css('--fg'),red=css('--brand'),bg=css('--surf'),ln=css('--line'),wh=css('--surf2'),fl=css('--bg');
  const T=(x,y,s,c,an)=>`<text x="${r1(x)}" y="${r1(y)}" font-size="${r1(fs)}" fill="${c||fg}" text-anchor="${an||'middle'}" stroke="${bg}" stroke-width="${r1(fs*0.25)}" paint-order="stroke">${s}</text>`;
  const Ln=(x1,y1,x2,y2,c,dash)=>`<line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}" stroke="${c}" stroke-width="${r1(sw*1.5)}"${dash?` stroke-dasharray="${r1(S*0.02)}"`:''}/>`;
  const dot=(x,y)=>`<circle cx="${r1(x)}" cy="${r1(y)}" r="${r1(S*0.028)}" fill="${red}" stroke="${fg}" stroke-width="${r1(sw)}"/>`;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${r1(W)} ${r1(HH)}" font-family="system-ui,sans-serif"><rect width="${r1(W)}" height="${r1(HH)}" rx="${r1(S*0.03)}" fill="${bg}"/>`;
  // top view
  s+=T(ox+tr/2,oy-fs*2.4,t().cogTop,dim)+T(ox+tr/2,oy-fs*0.9,'▲ '+t().cogFront,acc);
  s+=`<rect x="${r1(ox)}" y="${r1(oy)}" width="${r1(tr)}" height="${r1(wb)}" fill="${fl}" stroke="${ln}" stroke-width="${r1(sw)}"/>`;
  [[ox,oy],[ox+tr,oy],[ox,oy+wb],[ox+tr,oy+wb]].forEach(([x,y])=>s+=`<rect x="${r1(x-wr*0.45)}" y="${r1(y-wr)}" width="${r1(wr*0.9)}" height="${r1(wr*2)}" rx="${r1(wr*0.2)}" fill="${wh}" stroke="${dim}" stroke-width="${r1(sw)}"/>`);
  s+=T(ox-wr*1.6,oy+wb/2+fs/3,t().cogL,dim)+T(ox+tr+wr*1.6,oy+wb/2+fs/3,t().cogR,dim);
  s+=Ln(ox+tr/2-S*0.03,oy+wb/2,ox+tr/2+S*0.03,oy+wb/2,dim)+Ln(ox+tr/2,oy+wb/2-S*0.03,ox+tr/2,oy+wb/2+S*0.03,dim);   // geometric center
  s+=Ln(cx,cy,cx,oy+wb,acc,1)+T(cx+fs*0.4,(cy+oy+wb)/2+fs/3,r1(k.fromRear)+cmU,acc,'start');
  s+=Ln(cx,cy,ox+tr,cy,acc,1)+T((cx+ox+tr)/2,cy-fs*0.5,r1(k.fromRight)+cmU,acc);
  s+=dot(cx,cy);
  s+=T(ox+tr/2,oy+wb+wr+fs*1.3,r1(tr)+' × '+r1(wb)+cmU,dim);
  // side view
  s+=T(sx+wb/2,sTop-fs*2.4,t().cogSide,dim)+T(sx+wb,sTop-fs*0.9,t().cogFront+' ▶',acc,'end');
  s+=Ln(sx-m*0.4,gy,sx+wb+m*0.4,gy,dim);
  [sx,sx+wb].forEach(x=>s+=`<circle cx="${r1(x)}" cy="${r1(gy-wr)}" r="${r1(wr)}" fill="${wh}" stroke="${dim}" stroke-width="${r1(sw)}"/>`);
  s+=Ln(px,py,sx,gy,dim,1)+Ln(px,py,sx+wb,gy,dim,1);   // tipping lines: past them the robot falls
  s+=T(sx+fs*0.2,gy-wr*2-fs*0.6,deg(k.fromRear,h)+'°',dim,'start')+T(sx+wb-fs*0.2,gy-wr*2-fs*0.6,deg(wb-k.fromRear,h)+'°',dim,'end');
  s+=Ln(px,gy,px,py,acc)+T(px+fs*0.4,(gy+py)/2,'h '+r1(h)+cmU,acc,'start');
  s+=dot(px,py);
  s+=T(sx+wb/2,gy+fs*1.4,r1(wb)+cmU,dim);
  return s+'</svg>';
}

// ---------------------------------------------------------------- plain-language summary
const f1=v=>(Math.round(v*10)/10).toString(), f2=v=>(Math.round(v*100)/100).toString();
// "frontLeft", "left_front_drive", "lf"...: a drivetrain wheel by its name (as FtcBlackBox.isDriveMotor)
const isDriveName=n=>{const s=n.toLowerCase().replace(/motor|drive|wheel|[^a-z]/g,'');
  return /left|right/.test(s)&&/front|back|rear/.test(s)||/^([lr][fbr]|[fbr][lr]|left|right)$/.test(s)};
function analyze(data,events,report){
  const col=n=>{const i=data.h.indexOf(n);return i<0?null:data.cols[i]}, tt=data.cols[0], out={motors:[],power:[],program:[],events:[],history:[]};
  // motors: everything with .power and .amps
  const motors=data.h.filter(n=>n.endsWith('.power')&&col(n.slice(0,-6)+'.amps')).map(n=>n.slice(0,-6));
  const stat={};
  // used = any real command (a lift holding at 0.1 is used); current is judged only above 0.25, where a working motor draws clearly
  motors.forEach(m=>{const p=col(m+'.power'),a=col(m+'.amps'),pos=col(m+'.pos');let n=0,sum=0,maxPos=0,use=0;
    for(let i=0;i<p.length;i++){if(Math.abs(p[i])>0.05){use++;if(pos&&isFinite(pos[i]))maxPos=Math.max(maxPos,Math.abs(pos[i]))}
      if(Math.abs(p[i])>0.25&&isFinite(a[i])){n++;sum+=a[i]}}
    stat[m]={used:use>20,strong:n>20,amps:n?sum/n:NaN,enc:maxPos>=5}});
  const used=motors.filter(m=>stat[m].used), noEnc=used.filter(m=>!(stat[m].amps<0.2)&&!stat[m].enc);
  used.forEach(m=>{const s=stat[m];let lv='g',txt=t().mOk(f1(s.amps)),todo='';
    const others=isDriveName(m)?used.filter(o=>o!==m&&isDriveName(o)&&stat[o].amps>=0.2).map(o=>stat[o].amps).sort((x,y)=>x-y):[],med=others.length?others[others.length>>1]:0;
    let src='robot';   // no current, friction, no encoder: wiring and mechanics
    if(!s.strong){txt=t().mLow}
    else if(s.amps<0.2){lv='r';txt=t().mNoCur;todo=t().mNoCurDo}
    // friction: a reason to look, never an emergency; needs both +30% and +0.4 A so noise on small currents stays green
    else if(med>0.3&&s.amps>=1.3*med&&s.amps-med>0.4&&others.length>=2){const pc=Math.round((s.amps/med-1)*100);lv='y';txt=t().mMore(pc,f1(s.amps));todo=t().mMoreDo}
    else if(!s.enc&&noEnc.length<used.length){lv='y';txt=t().mEnc;todo=t().mEncDo}
    out.motors.push({lv,name:m,txt,todo,src:lv==='g'?'':src})});
  motors.filter(m=>!stat[m].used).forEach(m=>out.motors.push({lv:'n',name:m,txt:t().mOff}));
  if(used.length&&noEnc.length===used.filter(m=>!(stat[m].amps<0.2)).length&&noEnc.length>0)out.motors.push({lv:'y',name:'',txt:t().mEncAll,todo:t().mEncDo,src:'robot'});
  // battery
  const bat=col('battery'),init=col('battery.init');let v0=init&&isFinite(init[0])?init[0]:NaN,vmin=Infinity;
  if(bat)bat.forEach(v=>{if(isFinite(v)&&v>5){if(!isFinite(v0))v0=v;vmin=Math.min(vmin,v)}});
  const rm=report.match(/ ([\d.]+) ohm/),R=rm?+rm[1]:NaN,rs=isFinite(R)?(L==='en'?`, resistance ${f2(R)} Ω`:L==='ro'?`, rezistență ${f2(R)} Ω`:`, сопротивление ${f2(R)} Ом`):'';
  if(isFinite(v0)){
    if(isFinite(vmin)&&vmin<8)out.power.push({lv:'r',txt:t().bDrop(f1(vmin)),todo:t().bDropDo,src:'robot'});
    if(v0<12.4)out.power.push({lv:'y',txt:t().bLow(f2(v0)),todo:t().bLowDo,src:'robot'});
    if(R>=0.25)out.power.push({lv:'r',txt:t().bWeak(f2(R)),todo:t().bWeakDo,src:'robot'});else if(R>=0.15)out.power.push({lv:'y',txt:t().bWatch(f2(R)),todo:t().bWeakDo,src:'robot'});
    if(!out.power.length)out.power.push({lv:'g',txt:t().bOk(f2(v0),rs)});}
  // hubs
  data.h.filter(n=>n.endsWith('.ok')&&!n.startsWith('gamepad')).forEach(n=>{const ok=col(n),tc=col(n.slice(0,-3)+'.temp');let lost=false,tmax=-Infinity;
    ok.forEach(v=>{if(v===0)lost=true});if(tc)tc.forEach(v=>{if(isFinite(v))tmax=Math.max(tmax,v)});
    const hub=n.slice(0,-3).replace(/_/g,' ');
    if(lost)out.power.push({lv:'r',name:hub,txt:t().hubLost,todo:t().hubLostDo,src:'robot'});else if(tmax>60)out.power.push({lv:'y',name:hub,txt:t().hubHot(Math.round(tmax)),src:'robot'});
    else out.power.push({lv:'g',name:hub,txt:t().hubOk(isFinite(tmax)?Math.round(tmax):'?')})});
  // loop
  const auto=(events.cols[1]||[]).includes('AUTO_RECORD'),lp=auto?null:col('loop_ms');   // automatic recording: its own clock, not the team's loop
  if(auto)out.program.push({lv:'n',txt:t().autoRec});
  if(lp){const v=lp.filter(x=>isFinite(x)&&x>0).sort((a,b)=>a-b);if(v.length){const med=v[v.length>>1];
    out.program.push(med>50?{lv:'y',txt:t().loopSlow(f1(med)),todo:t().loopSlowDo,src:'code'}:{lv:'g',txt:t().loopOk(f1(med))})}}
  // ---- the program vs the robot: driver input -> commanded power -> measured motion
  const T0=(()=>{const i=(events.cols[1]||[]).indexOf('START');return i>=0?events.cols[0][i]:-Infinity})();   // driving only
  const dtAt=i=>i>0&&isFinite(tt[i]-tt[i-1])?Math.min(0.2,tt[i]-tt[i-1]):0;
  const isDrive=n=>{const s=n.toLowerCase().replace(/motor|drive|wheel|[^a-z]/g,'');
    return /left|right/.test(s)&&/front|back|rear/.test(s)||/^([lr][fbr]|[fbr][lr]|left|right)$/.test(s)};
  // 1. sticks pushed, no drive motor powered: the code does not turn the sticks into power
  const ly=col('gamepad1.ly'),lx=col('gamepad1.lx'),rx=col('gamepad1.rx'),dm=motors.filter(isDrive),pw=(dm.length?dm:motors).map(m=>col(m+'.power'));
  if(ly&&pw.length){let dead=0;for(let i=0;i<tt.length;i++){if(tt[i]<T0)continue;
      const st=Math.max(Math.abs(ly[i]||0),Math.abs(lx?lx[i]||0:0),Math.abs(rx?rx[i]||0:0));
      if(st>0.5&&pw.every(p=>!(Math.abs(p[i])>0.02)))dead+=dtAt(i)}
    if(dead>=1)out.program.push({lv:'y',txt:t().cStick(f1(dead)),todo:t().cStickDo,src:'code'})}
  motors.forEach(m=>{const p=col(m+'.power'),v=col(m+'.vel');
    // 2. power flipping sign many times a second: an over-tuned controller or two pieces of code fighting
    let flips=[],last=0;for(let i=0;i<p.length;i++){if(tt[i]<T0||!(Math.abs(p[i])>0.05))continue;const sg=Math.sign(p[i]);if(last&&sg!==last)flips.push(tt[i]);last=sg}
    let worst=0,bad=0;for(let a=0,b=0;b<flips.length;b++){while(flips[b]-flips[a]>1)a++;const n=b-a+1;worst=Math.max(worst,n);if(n>=6)bad++}
    if(bad>=6)out.program.push({lv:'y',name:m,txt:t().cOsc(m,worst),todo:t().cOscDo,src:'code'});
    // 3. the encoder turns against the commanded power: direction in code, or the encoder plugged into another port
    const fast=v?v.filter(x=>isFinite(x)&&x!==0).map(Math.abs).sort((a,b)=>a-b):[],odo=fast.length&&fast[fast.length>>1]>5000;   // a motor encoder stays under ~3000 ticks/s
    if(v&&!odo){let n=0,opp=0;for(let i=0;i<p.length;i++){if(tt[i]<T0||!(Math.abs(p[i])>0.3)||!(Math.abs(v[i])>50))continue;n++;if(Math.sign(p[i])!==Math.sign(v[i]))opp++}
      if(n>=20&&opp/n>0.8)out.program.push({lv:'y',name:m,txt:t().cDir(Math.round(100*opp/n)),todo:t().cDirDo,src:'code'})}});
  // warnings during the session, in words
  const et=events.cols[0]||[],ety=events.cols[1]||[],ed=events.cols[2]||[];
  et.forEach((x,i)=>{const ty=ety[i];if(ty!=='WARNING'&&ty!=='CRITICAL'&&ty!=='CRASH')return;const d=String(ed[i]||'');const name=(d.split(' ')[0]||'');
    const key=ty==='CRASH'?'crash':Object.keys(t().rule).sort((a,b)=>b.length-a.length).find(k=>name.endsWith(k));
    const who=(key&&key!=='crash'?name.slice(0,name.length-key.length).replace(/-$/,''):'').replace(/^hub-of-/,t().hubOf+' ');
    const mm=Math.floor(x/60),ss=Math.floor(x%60);
    // the program's own faults vs the robot's; 'zeroed' can be either, so it gets no label
    const src=key==='crash'||key==='slow-loop'||key==='loop-pause'?'code':key&&key!=='zeroed'?'robot':'';
    out.events.push({lv:ty==='WARNING'?'y':'r',name:who,txt:(key?t().rule[key]:d)+`  (${t().at} ${mm}:${String(ss).padStart(2,'0')})`,src})});
  if(!out.events.length)out.events.push({lv:'g',txt:t().evNone});
  // compared with earlier sessions
  if(/first session/.test(report))out.history.push({lv:'n',txt:t().first});
  // a motor check spins different motors each time, so comparing it with earlier ones means nothing;
  // over +500% the earlier sessions simply did not use that motor (old reports before 1.4.1)
  if(!/healthcheck/.test(report))report.split('\n').forEach(l=>{const m=l.match(/^(\S+)\.amps peak .* \(\+(\d+)%\)/);
    if(m&&m[1]!=='battery'&&+m[2]<=500)out.history.push({lv:+m[2]>=60?'r':'y',txt:t().histMore(m[1],m[2]),todo:t().mMoreDo})});
  return out;
}
// the verdict block and a group of findings, shared by recordings, center of gravity and SysId
function hero(lv,title,meta,text,cnt){const h=el('div','hero enter lv-'+lv);h.append(el('h1',null,title));if(meta)h.append(el('div','meta',meta));if(text)h.append(el('p',null,text));
  if(cnt){const c=el('div','counts');[['r',t().nUrg],['y',t().nChk],['g',t().nOk]].forEach(([l,w])=>{if(cnt[l])c.append(el('span','lv-'+l,cnt[l]+' '+w))});
    [['code',t().srcCode],['robot',t().srcRobot]].forEach(([k,w])=>{if(cnt[k])c.append(el('span','src '+k,cnt[k]+' '+w))});if(c.children.length)h.append(c)}return h}
function group(title,rows,cls){const c=el('div','panel'+(cls?' '+cls:''));if(title)c.append(el('h2',null,title));
  rows.forEach(r=>{const row=el('div','row'),body=el('div'),b=el('b');if(r.name)b.append(el('span','who',r.name));b.append(el('span',null,r.txt));
    if(r.src&&r.lv!=='g'&&r.lv!=='n')b.append(el('span','src '+r.src,r.src==='code'?t().srcCode:t().srcRobot));body.append(b);
    if(r.todo)body.append(el('div','todo',r.todo));row.append(el('div','dot lv-'+r.lv),body);c.append(row)});return c}
const tally=rows=>{const n={r:0,y:0,g:0,code:0,robot:0};rows.forEach(x=>{if(n[x.lv]!=null)n[x.lv]++;if((x.lv==='r'||x.lv==='y')&&x.src)n[x.src]++});return n};
function renderSummary(o,meta){const box=$('#summary');box.innerHTML='';
  const n=tally([].concat(o.motors,o.power,o.program,o.events,o.history));
  box.append(hero(n.r?'r':n.y?'y':'g',n.r?t().urgent:n.y?t().check:t().allOk,meta,null,n));
  [['motors',o.motors],['power',o.power],['program',o.program],['events',o.events],['history',o.history]].forEach(([k,rows])=>{if(rows.length)box.append(group(t()[k],rows))})}

async function openSession(f,d){current={f,d};pick($('#slist'),d);$('#raw').classList.remove('hide');const my=++seq;const data=csv(await get('/file/'+f));let ev={h:[],cols:[[],[],[]]},rep='';
  try{ev=csv(await get('/file/'+f.replace(/\.csv$/,'.events.csv')))}catch(e){}try{rep=await get('/file/'+f.replace(/\.csv$/,'.report.txt'))}catch(e){}
  if(my!==seq)return;
  const T0=data.cols[0],secs=T0.length?T0[T0.length-1]:0,dur=secs>=60?Math.round(secs/60)+' '+t().min:Math.round(secs)+' '+t().sec;
  renderSummary(analyze(data,ev,rep),nice(f).concat(dur).filter(Boolean).join(', '));
  const marks=(ev.cols[0]||[]).map((x,i)=>({t:x,c:ev.cols[1][i]==='CRITICAL'?'crit':ev.cols[1][i]==='WARNING'?'warn':'line'}));
  const cols=$('#scols');cols.innerHTML='';const chosen=new Set(data.h.filter(n=>n==='battery'||n.endsWith('.amps')).slice(0,5));
  const draw=()=>{const p=$('#splots');p.innerHTML='';data.h.forEach((n,i)=>{if(chosen.has(n))plot(p,n,data.cols[0],data.cols[i],marks)})};
  data.h.slice(1).forEach(n=>{const l=el('label'),c=el('input');c.type='checkbox';c.checked=chosen.has(n);c.onchange=()=>{c.checked?chosen.add(n):chosen.delete(n);draw()};l.append(c,n);cols.append(l)});
  $('#raw').ontoggle=()=>{if($('#raw').open)draw()};if($('#raw').open)draw();
  const dl=el('a','dl','AdvantageScope .wpilog');dl.href='/wpilog/'+f;$('#splots').before(dl);$('#raw').querySelectorAll('a.dl').forEach(x=>{if(x!==dl)x.remove()});
  $('#sinfo').textContent=(rep?rep+'\n':'')+(ev.cols[0]||[]).map((x,i)=>x.toFixed(2)+' s  '+ev.cols[1][i]+'  '+(ev.cols[2][i]||'')).join('\n');
}

function sysidSummary(txt){const L1=txt.split('\n'),o=[],box=$('#ysum');box.innerHTML='';
  const head=L1[0]||'',isVerify=/VERIFY/.test(head);let verdict,lv;
  const note=line=>{for(const [re,txt2] of t().notes)if(re.test(line))return txt2;return line};
  if(isVerify){const m=head.match(/RMS -(-?[\d.]+|NaN)%/),pct=m?m[1]:'NaN';   // "RMS --12%": feedforward made it worse
    if(/MODEL VALIDATED/.test(head)){lv='g';verdict=t().vOk(Math.round(+pct));o.push({lv:'g',txt:t().vOkDo})}
    else if(pct==='NaN'||/moves 0 \+ 0/.test(txt)){lv='r';verdict=t().vNone;o.push({lv:'r',txt:t().vNoneDo})}
    else{lv='y';verdict=t().vNo;o.push({lv:'y',txt:t().vNoDo})}}
  else{const q=(head.match(/\b(GOOD|OK|POOR)\b/)||[])[1]||'POOR',name=head.split(' ')[0];
    lv=q==='GOOD'?'g':q==='OK'?'y':'r';verdict=q==='GOOD'?t().yGood:q==='OK'?t().yOk:t().yPoor;
    o.push({lv,txt:q==='GOOD'?t().yGoodDo(name):q==='OK'?t().yOkDo:t().yPoorDo});
    const k={};(L1[1]||'').replace(/(k[SGVA])=([-\d.eE+]+)/g,(_,a,b)=>{k[a]=b});
    const unc={};(L1[2]||'').replace(/(k[SGVA]) (\d+)%/g,(_,a,b)=>{unc[a]=+b});
    let i=3;while(i<L1.length&&!/^windows/.test(L1[i]))i++;
    for(i++;i<L1.length&&L1[i].trim()&&!L1[i].startsWith('//');i++)o.push({lv:q==='GOOD'?'n':lv,txt:note(L1[i])});
    o.mean=['kS','kG','kV','kA'].filter(x=>k[x]!=null).map(x=>({lv:unc[x]==null?'n':unc[x]<=10?'g':unc[x]<=25?'y':'r',
      txt:t()[x](+(+k[x]).toPrecision(3))+(unc[x]!=null?`  (${t().yUnc} ±${unc[x]}%${unc[x]<=10?' — '+t().ySure:''})`:'')}));}
  box.append(hero(lv,verdict));box.append(group(null,o));
  if(o.mean&&o.mean.length)box.append(group(t().yMean,o.mean));}
let ycur=null;
let yseq=0;
async function openSysId(f,d){ycur={f,d};pick($('#ylist'),d);const my=++yseq;const txt=await get('/file/'+f);if(my!==yseq)return;
  $('#yres').textContent=txt;$('#cst').textContent='';sysidSummary(txt);
  const at=txt.indexOf('// ASA SysId');$('#copy').classList.toggle('hide',at<0);   // a verification has no constants to copy
  $('#copy').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(txt.slice(at)):Promise.reject()).then(()=>$('#cst').textContent=t().copied,()=>$('#cst').textContent=t().copyManual)};
  const p=$('#yplots'),det=p.closest('details');p.innerHTML='';let data=null;
  try{data=csv(await get('/file/'+f.replace(/\.result\.txt$/,'.csv')))}catch(e){}
  if(my!==yseq||!data)return;
  const idx=data.cols[0].map((_,i)=>i),draw=()=>{p.innerHTML='';['volts','vel','pos'].forEach(n=>{const i=data.h.indexOf(n);if(i>0)plot(p,n,idx,data.cols[i],null,true)})};
  det.ontoggle=()=>{if(det.open)draw()};if(det.open)draw();   // drawn when visible: a closed panel has no width
}
