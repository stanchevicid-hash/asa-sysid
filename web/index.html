<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASA Black Box</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--fg:#e6e8ee;--dim:#8a91a0;--acc:#4da3ff;--warn:#ffb020;--crit:#ff4d5e;--ok:#3ccf7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
header{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
header b{margin-right:12px}button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
button.on{border-color:var(--acc);color:var(--acc)}main{padding:16px;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:250px 1fr;gap:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;overflow:auto}
.list div{padding:7px 9px;border-radius:6px;cursor:pointer}.list div:hover,.list div.on{background:#232835}.list small{display:block;color:var(--dim)}
table{border-collapse:collapse;width:100%}td{padding:3px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}td:last-child{text-align:right}
.WARNING{color:var(--warn)}.CRITICAL{color:var(--crit)}.INFO{color:var(--dim)}.dim{color:var(--dim)}
canvas{width:100%;height:110px;display:block;margin-bottom:6px}label{display:inline-block;margin:2px 10px 2px 0;white-space:nowrap}
pre{margin:0;white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace}.hide{display:none}
.verdict{font-size:22px;font-weight:700;margin:0 0 4px}.row{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.dot{flex:0 0 14px;height:14px;border-radius:50%;margin-top:4px}.g{background:var(--ok)}.y{background:var(--warn)}.r{background:var(--crit)}.n{background:#4a5060}
.row b{display:block}.todo{color:var(--dim);font-size:14px;margin-top:2px}.todo:before{content:"→ "}
h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
footer{max-width:1100px;margin:0 auto 24px;padding:0 16px;color:var(--dim);font-size:14px}footer a{color:var(--acc);margin-right:14px;text-decoration:none}footer b{color:var(--fg)}
summary{cursor:pointer;color:var(--acc);padding:4px 0}#lang{margin-left:8px}#lang button{padding:4px 8px}
</style></head><body>
<header><b id="title">ASA Tools</b><button data-tab="sessions" class="on" id="t-sessions"></button><button data-tab="live" id="t-live"></button><button data-tab="sysid" id="t-sysid">SysId</button>

   'battery-low-at-start':'battery was low already at start','slow-loop':'the program was slow for a long time','loop-pause':'the program froze for a moment',crash:'the program crashed'},
  histMore:(n,p)=>`${n}: ${p}% more current than usual — the mechanism may be wearing`,histBat:p=>`battery sags more than usual`,
  first:'First session of this kind — nothing to compare with yet.',liveIdle:'No Black Box program is running now. Recordings are under "Sessions".'}};
let L=(()=>{try{const s=localStorage.getItem('asa-lang');if(T[s])return s}catch(e){}return'en'})();   // English unless the viewer picked RO/RU
const t=()=>T[L];
function applyLang(){$('#t-sessions').textContent=(tools.blackbox&&tools.sysid?'Black Box · ':'')+t().sessions;$('#t-yraw').textContent=t().yraw;$('#t-made').textContent=t().made;$('#t-fb').textContent='💬 '+t().fb;$('#t-net').textContent=t().net;$('#t-live').textContent=t().live;$('#t-raw').textContent=t().raw;
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));renderList();if(current)openSession(current.f,current.d);loadFiles().then(()=>{if(ycur)openSysId(ycur.f,ycur.d)})}
document.querySelectorAll('#lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('asa-lang',L)}catch(e){}applyLang()});

let tab='sessions',tools={blackbox:true,sysid:true};
async function detectTools(){try{tools=JSON.parse(await get('/api/tools'))}catch(e){}   // older robots: show both
  const bb=tools.blackbox,sy=tools.sysid,name=bb&&sy?'ASA Tools':sy?'ASA SysId':'ASA Black Box';
  $('#title').textContent=name;document.title=name;
  $('#t-sessions').classList.toggle('hide',!bb);$('#t-live').classList.toggle('hide',!bb);$('#t-sysid').classList.toggle('hide',!sy);
  const repo=!bb&&sy?'asa-sysid':'asa-blackbox';$('#gh').href='https://github.com/stanchevicid-hash/'+repo;
  $('#t-fb').href='https://github.com/stanchevicid-hash/'+repo+'/issues/new?template=robot-result.yml';
  applyLang();if(!bb&&sy)document.querySelector('#t-sysid').click();}
document.querySelectorAll('header button[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('header button[data-tab]').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hide',s.id!==tab));if(tab!=='live')loadFiles();});
const get=u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw r.status;return r.text()});
const sev=s=>(s.match(/\b(WARNING|CRITICAL|INFO)\b/)||['','INFO'])[1];

async function live(){
  if(tab==='live'){try{const j=JSON.parse(await get('/api/live'));$('#st').textContent='connected';
    $('#lstatus').textContent=j.status||(j.names.length?'':t().liveIdle);const tb=$('#ltab');tb.innerHTML='';
    j.names.forEach((n,i)=>{const r=tb.insertRow();r.insertCell().textContent=n;r.insertCell().textContent=j.values[i]==null?'-':(+j.values[i]).toFixed(3)});
    const w=$('#lwarn');w.innerHTML='';if(!j.warnings.length)w.append(el('div','dim',t().evNone));j.warnings.forEach(x=>w.append(el('div',sev(x),x)));
  }catch(e){$('#st').textContent='offline'}}
  setTimeout(live,500);
}
live();

function csv(text){const Ls=text.trim().split('\n'),h=Ls[0].split(','),cols=h.map(()=>[]);
  for(let i=1;i<Ls.length;i++){const p=Ls[i].split(',');for(let j=0;j<h.length;j++)cols[j].push(p[j]===''||p[j]==null?NaN:(isNaN(+p[j])?p[j]:+p[j]))}return{h,cols}}

function plot(box,name,xs,ys,marks){
  const c=el('canvas');box.append(c);const W=c.width=c.clientWidth*devicePixelRatio,H=c.height=110*devicePixelRatio,g=c.getContext('2d');
  let lo=Infinity,hi=-Infinity;ys.forEach(v=>{if(isFinite(v)){lo=Math.min(lo,v);hi=Math.max(hi,v)}});if(!isFinite(lo)){lo=0;hi=1}if(hi===lo){hi+=1;lo-=1}
  const x0=xs[0],x1=xs[xs.length-1]||1,X=x=>(x-x0)/(x1-x0||1)*(W-2)+1,Y=y=>H-4-(y-lo)/(hi-lo)*(H-22);
  g.strokeStyle='#2a2f3a';g.beginPath();g.moveTo(0,Y(0));g.lineTo(W,Y(0));g.stroke();
  (marks||[]).forEach(m=>{g.strokeStyle=m.c;g.beginPath();g.moveTo(X(m.t),14);g.lineTo(X(m.t),H);g.stroke()});
  g.strokeStyle='#4da3ff';g.lineWidth=1.5*devicePixelRatio;g.beginPath();const step=Math.max(1,Math.floor(xs.length/W));let pen=false;
  for(let i=0;i<xs.length;i+=step){const v=ys[i];if(!isFinite(v)){pen=false;continue}pen?g.lineTo(X(xs[i]),Y(v)):g.moveTo(X(xs[i]),Y(v));pen=true}g.stroke();
  g.fillStyle='#8a91a0';g.font=11*devicePixelRatio+'px system-ui';g.fillText(name+'   '+lo.toFixed(3)+' .. '+hi.toFixed(3),4,11*devicePixelRatio);
}

// "20261116_175029_drive.csv" -> "Drive · 16.11 17:50"
function nice(f){const m=f.match(/^(\d{4})(\d\d)(\d\d)_(\d\d)(\d\d)\d\d_(.+)\.csv$/);if(!m)return[f,''];
  const kind=t()[m[6]]||m[6];return[kind,`${m[3]}.${m[2]} ${m[4]}:${m[5]}`]}

let files=[],current=null;
async function loadFiles(){try{files=JSON.parse(await get('/api/files'))}catch(e){files=[]}renderList();
  const y=$('#ylist');y.innerHTML='';files.filter(f=>f.startsWith('sysid/')&&f.endsWith('.result.txt')).forEach(f=>{const m=f.match(/(\d{4})(\d\d)(\d\d)_(\d\d)(\d\d)\d\d_(sysid|verify)_(.+)\.result\.txt$/);const d=el('div',null,m?(m[6]==='verify'?t().verify.split(' (')[0]+': ':'')+m[7]:f.slice(6));if(m)d.append(el('small',null,`${m[3]}.${m[2]} ${m[4]}:${m[5]}`));d.onclick=()=>openSysId(f,d);y.append(d)});
  if(!y.children.length){y.append(el('div','dim','-'));$('#ysum').innerHTML='';$('#ysum').append(el('div','card dim',t().ynone))}}
function renderList(){const s=$('#slist');s.innerHTML='';
  files.filter(f=>/\.csv$/.test(f)&&!/\.(events|summary)\.csv$/.test(f)&&!f.startsWith('sysid/')&&!/batteries\.csv$/.test(f)).sort().reverse().forEach(f=>{
    const [a,b]=nice(f),d=el('div',null,a);d.append(el('small',null,b));d.onclick=()=>openSession(f,d);if(current&&current.f===f)d.classList.add('on');s.append(d)});
  if(!s.children.length)s.append(el('div','dim',t().none));
  if(!current)$('#summary').innerHTML='',$('#summary').append(el('div','card dim',files.length?t().pick:t().none));}
const pick=(box,d)=>{box.querySelectorAll('div').forEach(x=>x.classList.toggle('on',x===d))};

// ---------------------------------------------------------------- plain-language summary
const f1=v=>(Math.round(v*10)/10).toString(), f2=v=>(Math.round(v*100)/100).toString();
function analyze(data,events,report){
  const col=n=>{const i=data.h.indexOf(n);return i<0?null:data.cols[i]}, tt=data.cols[0], out={motors:[],power:[],program:[],events:[],history:[]};
  // motors: everything with .power and .amps
  const motors=data.h.filter(n=>n.endsWith('.power')&&col(n.slice(0,-6)+'.amps')).map(n=>n.slice(0,-6));
  const stat={};
  motors.forEach(m=>{const p=col(m+'.power'),a=col(m+'.amps'),pos=col(m+'.pos');let n=0,sum=0,maxPos=0;
    for(let i=0;i<p.length;i++){if(Math.abs(p[i])>0.25&&isFinite(a[i])){n++;sum+=a[i];if(pos&&isFinite(pos[i]))maxPos=Math.max(maxPos,Math.abs(pos[i]))}}
    stat[m]={used:n>20,amps:n?sum/n:0,enc:maxPos>=5}});
  const used=motors.filter(m=>stat[m].used), noEnc=used.filter(m=>stat[m].amps>=0.2&&!stat[m].enc);
  used.forEach(m=>{const s=stat[m];let lv='g',txt=t().mOk(f1(s.amps)),todo='';
    const others=used.filter(o=>o!==m&&stat[o].amps>=0.2).map(o=>stat[o].amps).sort((x,y)=>x-y),med=others.length?others[others.length>>1]:0;
    if(s.amps<0.2){lv='r';txt=t().mNoCur;todo=t().mNoCurDo}
    // friction: a reason to look, never an emergency; needs both +30% and +0.4 A so noise on small currents stays green
    else if(med>0.3&&s.amps>=1.3*med&&s.amps-med>0.4&&others.length>=2){const pc=Math.round((s.amps/med-1)*100);lv='y';txt=t().mMore(pc,f1(s.amps));todo=t().mMoreDo}
    else if(!s.enc&&noEnc.length<used.length){lv='y';txt=t().mEnc;todo=t().mEncDo}
    out.motors.push({lv,name:m,txt,todo})});
  motors.filter(m=>!stat[m].used).forEach(m=>out.motors.push({lv:'n',name:m,txt:t().mOff}));
  if(used.length&&noEnc.length===used.filter(m=>stat[m].amps>=0.2).length&&noEnc.length>0)out.motors.push({lv:'y',name:'',txt:t().mEncAll,todo:t().mEncDo});
  // battery
  const bat=col('battery'),init=col('battery.init');let v0=init&&isFinite(init[0])?init[0]:NaN,vmin=Infinity;
  if(bat)bat.forEach(v=>{if(isFinite(v)&&v>5){if(!isFinite(v0))v0=v;vmin=Math.min(vmin,v)}});
  const rm=report.match(/ ([\d.]+) ohm/),R=rm?+rm[1]:NaN,rs=isFinite(R)?(L==='en'?`, resistance ${f2(R)} Ω`:L==='ro'?`, rezistență ${f2(R)} Ω`:`, сопротивление ${f2(R)} Ом`):'';
  if(isFinite(v0)){
    if(isFinite(vmin)&&vmin<8)out.power.push({lv:'r',txt:t().bDrop(f1(vmin)),todo:t().bDropDo});
    if(v0<12.4)out.power.push({lv:'y',txt:t().bLow(f2(v0)),todo:t().bLowDo});
    if(R>=0.25)out.power.push({lv:'r',txt:t().bWeak(f2(R)),todo:t().bWeakDo});else if(R>=0.15)out.power.push({lv:'y',txt:t().bWatch(f2(R)),todo:t().bWeakDo});
    if(!out.power.length)out.power.push({lv:'g',txt:t().bOk(f2(v0),rs)});}
  // hubs
  data.h.filter(n=>n.endsWith('.ok')&&!n.startsWith('gamepad')).forEach(n=>{const ok=col(n),tc=col(n.slice(0,-3)+'.temp');let lost=false,tmax=-Infinity;
    ok.forEach(v=>{if(v===0)lost=true});if(tc)tc.forEach(v=>{if(isFinite(v))tmax=Math.max(tmax,v)});
    if(lost)out.power.push({lv:'r',txt:t().hubLost,todo:t().hubLostDo});else if(tmax>60)out.power.push({lv:'y',txt:t().hubHot(Math.round(tmax))});
    else out.power.push({lv:'g',txt:t().hubOk(isFinite(tmax)?Math.round(tmax):'?')})});
  // loop
  const lp=col('loop_ms');if(lp){const v=lp.filter(x=>isFinite(x)&&x>0).sort((a,b)=>a-b);if(v.length){const med=v[v.length>>1];
    out.program.push(med>50?{lv:'y',txt:t().loopSlow(f1(med)),todo:t().loopSlowDo}:{lv:'g',txt:t().loopOk(f1(med))})}}
  // warnings during the session, in words
  const et=events.cols[0]||[],ety=events.cols[1]||[],ed=events.cols[2]||[];
  et.forEach((x,i)=>{const ty=ety[i];if(ty!=='WARNING'&&ty!=='CRITICAL'&&ty!=='CRASH')return;const d=String(ed[i]||'');const name=(d.split(' ')[0]||'');
    const key=ty==='CRASH'?'crash':Object.keys(t().rule).sort((a,b)=>b.length-a.length).find(k=>name.endsWith(k));
    const who=key&&key!=='crash'?name.slice(0,name.length-key.length).replace(/-$/,''):'';
    const mm=Math.floor(x/60),ss=Math.floor(x%60);
    out.events.push({lv:ty==='WARNING'?'y':'r',name:who,txt:(key?t().rule[key]:d)+`  (${t().at} ${mm}:${String(ss).padStart(2,'0')})`})});
  if(!out.events.length)out.events.push({lv:'g',txt:t().evNone});
  // compared with earlier sessions
  if(/first session/.test(report))out.history.push({lv:'n',txt:t().first});
  // a motor check spins different motors each time, so comparing it with earlier ones means nothing;
  // over +500% the earlier sessions simply did not use that motor (old reports before 1.4.1)
  if(!/healthcheck/.test(report))report.split('\n').forEach(l=>{const m=l.match(/^(\S+)\.amps peak .* \(\+(\d+)%\)/);
    if(m&&m[1]!=='battery'&&+m[2]<=500)out.history.push({lv:+m[2]>=60?'r':'y',txt:t().histMore(m[1],m[2]),todo:t().mMoreDo})});
  return out;
}
function renderSummary(o,dur){const box=$('#summary');box.innerHTML='';
  const all=[].concat(o.motors,o.power,o.program,o.events,o.history),nr=all.filter(x=>x.lv==='r').length,ny=all.filter(x=>x.lv==='y').length;
  const top=el('div','card');const v=el('div','verdict',nr?`🔴 ${t().urgent} (${nr})`:ny?`🟡 ${t().check} (${ny})`:`🟢 ${t().allOk}`);top.append(v);
  if(dur)top.append(el('div','dim',dur));box.append(top);
  [['motors',o.motors],['power',o.power],['program',o.program],['events',o.events],['history',o.history]].forEach(([k,rows])=>{if(!rows.length)return;
    const c=el('div','card');c.append(el('h3',null,t()[k]));
    rows.forEach(r=>{const row=el('div','row'),d=el('div','dot '+r.lv),body=el('div');const b=el('b');if(r.name)b.append(el('span',null,r.name+' — '));b.append(el('span',null,r.txt));body.append(b);
      if(r.todo)body.append(el('div','todo',r.todo));row.append(d,body);c.append(row)});box.append(c)});}

async function openSession(f,d){current={f,d};pick($('#slist'),d);const data=csv(await get('/file/'+f));let ev={h:[],cols:[[],[],[]]},rep='';
  try{ev=csv(await get('/file/'+f.replace(/\.csv$/,'.events.csv')))}catch(e){}try{rep=await get('/file/'+f.replace(/\.csv$/,'.report.txt'))}catch(e){}
  const T0=data.cols[0],secs=T0.length?T0[T0.length-1]:0,dur=secs>=60?Math.round(secs/60)+' '+t().min:Math.round(secs)+' '+t().sec;
  renderSummary(analyze(data,ev,rep),nice(f).join(' · ')+' · '+dur);
  const marks=(ev.cols[0]||[]).map((x,i)=>({t:x,c:ev.cols[1][i]==='CRITICAL'?'#ff4d5e':ev.cols[1][i]==='WARNING'?'#ffb020':'#3a4252'}));
  const cols=$('#scols');cols.innerHTML='';const chosen=new Set(data.h.filter(n=>n==='battery'||n.endsWith('.amps')).slice(0,5));
  const draw=()=>{const p=$('#splots');p.innerHTML='';data.h.forEach((n,i)=>{if(chosen.has(n))plot(p,n,data.cols[0],data.cols[i],marks)})};
  data.h.slice(1).forEach(n=>{const l=el('label'),c=el('input');c.type='checkbox';c.checked=chosen.has(n);c.onchange=()=>{c.checked?chosen.add(n):chosen.delete(n);draw()};l.append(c,' '+n);cols.append(l)});
  $('#raw').ontoggle=()=>{if($('#raw').open)draw()};if($('#raw').open)draw();
  const dl=el('a',null,'AdvantageScope .wpilog');dl.href='/wpilog/'+f;dl.style.cssText='display:inline-block;margin:8px 0 0;color:var(--acc)';cols.append(el('br'),dl);
  $('#sinfo').textContent=(rep?rep+'\n':'')+(ev.cols[0]||[]).map((x,i)=>x.toFixed(2)+' s  '+ev.cols[1][i]+'  '+(ev.cols[2][i]||'')).join('\n');
}

function sysidSummary(txt){const L1=txt.split('\n'),o=[],box=$('#ysum');box.innerHTML='';const card=el('div','card');
  const head=L1[0]||'',isVerify=/VERIFY/.test(head);let verdict,lv;
  const note=line=>{for(const [re,txt2] of t().notes)if(re.test(line))return txt2;return line};
  if(isVerify){const m=head.match(/RMS -([\d.]+|NaN)%/),pct=m?m[1]:'NaN';
    if(/MODEL VALIDATED/.test(head)){lv='g';verdict=t().vOk(Math.round(+pct));o.push({lv:'g',txt:t().vOkDo})}
    else if(pct==='NaN'||/moves 0 \+ 0/.test(txt)){lv='r';verdict=t().vNone;o.push({lv:'r',txt:t().vNoneDo})}
    else{lv='y';verdict=t().vNo;o.push({lv:'y',txt:t().vNoDo})}}
  else{const q=(head.match(/\b(GOOD|OK|POOR)\b/)||[])[1]||'POOR',name=head.split(' ')[0];
    lv=q==='GOOD'?'g':q==='OK'?'y':'r';verdict=q==='GOOD'?t().yGood:q==='OK'?t().yOk:t().yPoor;
    o.push({lv,txt:q==='GOOD'?t().yGoodDo(name):q==='OK'?t().yOkDo:t().yPoorDo});
    const k={};(L1[1]||'').replace(/(k[SGVA])=([-\d.eE+]+)/g,(_,a,b)=>{k[a]=b});
    const unc={};(L1[2]||'').replace(/(k[SGVA]) (\d+)%/g,(_,a,b)=>{unc[a]=+b});
    let i=3;while(i<L1.length&&!/^windows/.test(L1[i]))i++;
    for(i++;i<L1.length&&L1[i].trim()&&!L1[i].startsWith('//');i++)o.push({lv:q==='GOOD'?'n':lv,txt:note(L1[i])});
    o.mean=['kS','kG','kV','kA'].filter(x=>k[x]!=null).map(x=>({lv:unc[x]==null?'n':unc[x]<=10?'g':unc[x]<=25?'y':'r',
      txt:t()[x](+(+k[x]).toPrecision(3))+(unc[x]!=null?`  (${t().yUnc} ±${unc[x]}%${unc[x]<=10?' — '+t().ySure:''})`:'')}));}
  card.append(el('div','verdict',(lv==='g'?'🟢 ':lv==='y'?'🟡 ':'🔴 ')+verdict));
  o.forEach(r=>{const row=el('div','row');row.append(el('div','dot '+r.lv),el('div',null,r.txt));card.append(row)});box.append(card);
  if(o.mean&&o.mean.length){const c=el('div','card');c.append(el('h3',null,t().yMean));
    o.mean.forEach(r=>{const row=el('div','row');row.append(el('div','dot '+r.lv),el('div',null,r.txt));c.append(row)});box.append(c)}}
let ycur=null;
async function openSysId(f,d){ycur={f,d};pick($('#ylist'),d);const txt=await get('/file/'+f);$('#yres').textContent=txt;$('#cst').textContent='';sysidSummary(txt);
  $('#copy').onclick=()=>{const j=txt.slice(txt.indexOf('// ASA SysId'));(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>$('#cst').textContent='copied',()=>$('#cst').textContent='select the text and copy')};
  const p=$('#yplots');p.innerHTML='';try{const data=csv(await get('/file/'+f.replace(/\.result\.txt$/,'.csv'))),idx=data.cols[0].map((_,i)=>i);
    ['volts','vel','pos'].forEach(n=>{const i=data.h.indexOf(n);if(i>0)plot(p,n,idx,data.cols[i])})}catch(e){}
}
applyLang();detectTools().then(loadFiles);
